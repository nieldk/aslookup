
name: "Build and Release aslookup-win"

on:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: codeberg-tiny

    steps:
      - name: "Checkout code"
        run: |
          git clone "$CI_REPOSITORY_URL" .
          git checkout "$CI_COMMIT_REF_NAME"

      - name: "Install cross-compilation tools"
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 zip jq curl

      - name: "Set release version"
        run: echo "RELEASE_VERSION=${CI_COMMIT_TAG}" >> $GITHUB_ENV

      - name: "Build Windows executable"
        run: |
          x86_64-w64-mingw32-gcc aslookup-win.c cJSON.c -o aslookup-win.exe \
            -lws2_32 -lcurl -DPROGRAM_VERSION="\"$RELEASE_VERSION\""

      - name: "Package executable"
        run: |
          zip aslookup_${RELEASE_VERSION}_win.zip aslookup-win.exe

      - name: "Upload ZIP to Codeberg Release"
        run: |
          RELEASE_ID=$(curl -s -H "Authorization: token $CODEBERG_TOKEN" \
            "https://codeberg.org/api/v1/repos/${CI_REPO_OWNER}/${CI_REPO_NAME}/releases" \
            | jq -r ".[] | select(.tag_name==\"${CI_COMMIT_TAG}\") | .id")

          if [ -z "$RELEASE_ID" ]; then
            RELEASE_ID=$(curl -s -X POST \
              -H "Authorization: token $CODEBERG_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"${CI_COMMIT_TAG}\",\"name\":\"Release ${CI_COMMIT_TAG}\"}" \
              "https://codeberg.org/api/v1/repos/${CI_REPO_OWNER}/${CI_REPO_NAME}/releases" \
              | jq -r ".id")
          fi

          curl -X POST \
            -H "Authorization: token $CODEBERG_TOKEN" \
            -F "attachment=@aslookup_${RELEASE_VERSION}_win.zip" \
            "https://codeberg.org/api/v1/repos/${CI_REPO_OWNER}/${CI_REPO_NAME}/releases/${RELEASE_ID}/assets"

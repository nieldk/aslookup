name: "Build and Release Packages"

# Trigger on tags, same as original
on:
  push:
    tags:
      - "*"

jobs:
  # ---------------- Ubuntu (.deb) ----------------
  build-ubuntu:
    # ❌ FIX 1: Use a standard hosted runner label
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout code"
        # ❌ FIX 2: Use gitea context for the tag/ref name
        run: |
          # Use the tag name from the Gitea context for cloning
          TAG_OR_MAIN="${{ gitea.tag || 'main' }}"
          git clone --depth 1 --branch "$TAG_OR_MAIN" https://codeberg.org/nieldk/aslookup.git .

      - name: "Install dependencies"
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libcurl4-openssl-dev libcjson-dev dpkg-dev jq curl

      - name: "Set version"
        run: |
          # ❌ FIX 3: Use gitea context variable for the tag name
          # Codeberg's CI supports writing to $GITHUB_ENV for persistence
          TAG_NAME="${{ gitea.tag }}"
          TAG_NAME="${TAG_NAME#v}"
          echo "RELEASE_VERSION=$TAG_NAME" >> $GITHUB_ENV

      - name: "Build binary"
        run: gcc aslookup.c -o aslookup -lcurl -lcjson -lresolv -DVERSION="\"$RELEASE_VERSION\""

      - name: "Prepare .deb package"
        run: |
          # Uses the exported $RELEASE_VERSION environment variable
          mkdir -p pkg/usr/local/bin
          cp aslookup pkg/usr/local/bin/
          mkdir -p pkg/DEBIAN
          cat <<EOF > pkg/DEBIAN/control
          Package: aslookup
          Version: $RELEASE_VERSION
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Niel Nielsen <nieldk@gmail.com>
          Description: ASN lookup utility...
          EOF
          dpkg-deb --build pkg

      - name: "Upload Ubuntu .deb"
        # ❌ FIX 4: Use gitea context for repo owner and name in API calls
        run: |
          OWNER="${{ gitea.repository_owner }}"
          REPO="${{ gitea.repository_name }}"
          TAG_NAME="${{ gitea.tag }}"
          
          # Fetch RELEASE_ID or create a new release
          RELEASE_ID=$(curl -s -H "Authorization: token $CODEBERG_TOKEN" \
            "https://codeberg.org/api/v1/repos/$OWNER/$REPO/releases" \
            | jq -r ".[] | select(.tag_name==\"$TAG_NAME\") | .id")

          if [ -z "$RELEASE_ID" ]; then
            RELEASE_ID=$(curl -s -X POST \
              -H "Authorization: token $CODEBERG_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"$TAG_NAME\",\"name\":\"Release $TAG_NAME\"}" \
              "https://codeberg.org/api/v1/repos/$OWNER/$REPO/releases" \
              | jq -r .id)
          fi

          # Upload the deb package
          curl -s -X POST \
            -H "Authorization: token $CODEBERG_TOKEN" \
            -H "Content-Type: application/vnd.debian.binary-package" \
            --data-binary "@pkg.deb" \
            "https://codeberg.org/api/v1/repos/$OWNER/$REPO/releases/$RELEASE_ID/assets?name=aslookup_${RELEASE_VERSION}_amd64.deb"


  # ---------------- Windows (.zip) ----------------
  build-windows:
    # ❌ FIX 1: Use a standard hosted runner label
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout code"
        # ❌ FIX 2: Use gitea context for the tag/ref name
        run: |
          TAG_OR_MAIN="${{ gitea.tag || 'main' }}"
          git clone --depth 1 --branch "$TAG_OR_MAIN" https://codeberg.org/nieldk/aslookup.git .

      - name: "Install dependencies"
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 zip jq curl

      - name: "Set version"
        run: |
          # ❌ FIX 3: Use gitea context variable for the tag name
          TAG_NAME="${{ gitea.tag }}"
          TAG_NAME="${TAG_NAME#v}"
          echo "RELEASE_VERSION=$TAG_NAME" >> $GITHUB_ENV

      - name: "Build Windows executable"
        run: |
          x86_64-w64-mingw32-gcc aslookup-win.c cJSON.c -o aslookup-win.exe \
            -lws2_32 -lcurl -DPROGRAM_VERSION="\"$RELEASE_VERSION\""

      - name: "Package executable"
        run: zip aslookup_${RELEASE_VERSION}_win.zip aslookup-win.exe

      - name: "Upload Windows ZIP"
        # ❌ FIX 4: Use gitea context for repo owner and name in API calls
        run: |
          OWNER="${{ gitea.repository_owner }}"
          REPO="${{ gitea.repository_name }}"
          TAG_NAME="${{ gitea.tag }}"

          # Fetch RELEASE_ID or create a new release
          # Note: This checks if the release was created by the previous job, if not, it creates it.
          RELEASE_ID=$(curl -s -H "Authorization: token $CODEBERG_TOKEN" \
            "https://codeberg.org/api/v1/repos/$OWNER/$REPO/releases" \
            | jq -r ".[] | select(.tag_name==\"$TAG_NAME\") | .id")

          if [ -z "$RELEASE_ID" ]; then
            RELEASE_ID=$(curl -s -X POST \
              -H "Authorization: token $CODEBERG_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"$TAG_NAME\",\"name\":\"Release $TAG_NAME\"}" \
              "https://codeberg.org/api/v1/repos/$OWNER/$REPO/releases" \
              | jq -r .id)
          fi
          
          # Upload the zip file
          curl -s -X POST \
            -H "Authorization: token $CODEBERG_TOKEN" \
            -H "Content-Type: application/zip" \
            --data-binary "@aslookup_${RELEASE_VERSION}_win.zip" \
            "https://codeberg.org/api/v1/repos/$OWNER/$REPO/releases/$RELEASE_ID/assets?name=aslookup_${RELEASE_VERSION}_win.zip"
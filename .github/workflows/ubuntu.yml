name: "Build and Release Packages"

on:
  push:
    tags:
      - "*"

jobs:
  # ---------------- JOB 1: Ubuntu (.deb) ----------------
  build-ubuntu:
    runs-on: codeberg-tiny
    steps:
      - name: "Checkout code"
        run: |
          # Clone the full repository history
          git clone https://codeberg.org/nieldk/aslookup.git .
          # Checkout the specific commit that triggered the build (assuming CI_COMMIT_SHA is set)
          git checkout "$CI_COMMIT_SHA" || true

      - name: "Install dependencies"
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libcurl4-openssl-dev libcjson-dev dpkg-dev jq curl

      - name: "Set version (Git-based)"
        id: set_version_deb
        run: |
          # Get the version directly from Git using 'git describe'
          TAG_NAME=$(git describe --tags --abbrev=0 2>/dev/null)
          if [ -z "$TAG_NAME" ]; then
            TAG_NAME=$(git rev-parse --short HEAD)
          fi
          RELEASE_VERSION="${TAG_NAME#v}"
          
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> $GITHUB_ENV
          echo "DEBUG: Final calculated RELEASE_VERSION via git is '$RELEASE_VERSION'"
          
          # Store the calculated version in a temporary file (for cross-step access)
          # Note: This file is only needed for subsequent steps within this single job.
          echo -n "$RELEASE_VERSION" > .release_version 

      - name: "Build binary"
        run: |
          RELEASE_VERSION=$(cat .release_version | tr -d '\n\r')
          gcc aslookup.c -o aslookup -lcurl -lcjson -lresolv -DVERSION=\"\\\"$RELEASE_VERSION\\\"\"

      - name: "Prepare .deb package"
        run: |
          RELEASE_VERSION=$(cat .release_version | tr -d '\n\r')
          
          mkdir -p pkg/usr/local/bin
          cp aslookup pkg/usr/local/bin/
          mkdir -p pkg/DEBIAN
          cat <<EOF > pkg/DEBIAN/control
          Package: aslookup
          Version: $RELEASE_VERSION
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Niel Nielsen <nieldk@gmail.com>
          Description: ASN lookup utility
          EOF
          dpkg-deb --build pkg

      - name: "Upload Ubuntu .deb"
        env:
          AUTH_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          # --- Environment setup and version retrieval ---
          GIT_URL=$(git remote get-url origin)
          REPO_SLUG=$(echo "$GIT_URL" | sed -E 's/.*codeberg\.org[:/]([^\/]+\/[^.]+)(\.git)?$/\1/')
          REPO_OWNER=$(echo "$REPO_SLUG" | cut -d/ -f1)
          REPO_NAME=$(echo "$REPO_SLUG" | cut -d/ -f2)
          # The RELEASE_VERSION is available as an environment variable from step 1: set_version_deb
          RELEASE_VERSION="$RELEASE_VERSION"
          RELEASE_TAG="${CI_TAG:-${CI_COMMIT_TAG}}"
          if [ -z "$RELEASE_TAG" ]; then
            RELEASE_TAG="v$RELEASE_VERSION"
          fi
          AUTH_HEADER="Authorization: token ${AUTH_TOKEN}"
          # -----------------------------------------------

          echo "DEBUG: Checking/creating release for Tag='$RELEASE_TAG'"

          # Check for existing release
          RELEASE_ID=$(curl -s -H "$AUTH_HEADER" "https://codeberg.org/api/v1/repos/$REPO_OWNER/$REPO_NAME/releases" | jq -r "if type==\"array\" then .[] | select(.tag_name==\"$RELEASE_TAG\") | .id else empty end")

          if [ -z "$RELEASE_ID" ]; then
            echo "Release tag '$RELEASE_TAG' not found, creating new release..."
            API_RESPONSE=$(curl -s -X POST -H "$AUTH_HEADER" -H "Content-Type: application/json" -d "{\"tag_name\":\"$RELEASE_TAG\",\"name\":\"Release $RELEASE_TAG\"}" "https://codeberg.org/api/v1/repos/$REPO_OWNER/$REPO_NAME/releases" | tee /dev/stderr)
            RELEASE_ID=$(echo "$API_RESPONSE" | jq -r .id)

            if [ "$RELEASE_ID" == "null" ] || [ -z "$RELEASE_ID" ]; then
                echo "::error::Failed to create release."
                exit 1
            fi
            echo "Created new release with ID: $RELEASE_ID"
          else
            echo "Existing release found with ID: $RELEASE_ID"
          fi
          
          # Upload the built .deb package
          ASSET_NAME="aslookup-$RELEASE_VERSION-ubuntu-amd64.deb"
          UPLOAD_URL="https://codeberg.org/api/v1/repos/$REPO_OWNER/$REPO_NAME/releases/$RELEASE_ID/assets?name=$ASSET_NAME"
          
          echo "Attempting to upload file 'pkg.deb' to release ID $RELEASE_ID..."
          curl -v -X POST -H "$AUTH_HEADER" -H "Content-Type: application/octet-stream" --data-binary "@pkg.deb" "$UPLOAD_URL"
          echo "Upload attempt finished. Look for 201 Created status code above."

  # ---------------- JOB 2: Arch Linux (.pkg.tar.zst) ----------------
  build-arch:
    runs-on: codeberg-tiny
    steps:
      - name: "Checkout code"
        run: |
          # Clone the full repository history
          git clone https://codeberg.org/nieldk/aslookup.git .
          # Checkout the specific commit that triggered the build
          git checkout "$CI_COMMIT_SHA" || true
          
      - name: "Install dependencies (Ubuntu tools for Arch packaging) and check zstd"
        run: |
          # Ensure a fresh update before attempting to install zstd
          sudo apt-get update
          # Install core build and utility tools, including zstd
          sudo apt-get install -y gcc libcurl4-openssl-dev libcjson-dev jq curl tar zstd
          
          # Verification check: If zstd still isn't installed, fail early.
          if ! command -v zstd &> /dev/null; then
              echo "::error::The 'zstd' command is not available after installation. Cannot create Arch package."
              exit 1
          fi

      - name: "Set version (Git-based)"
        id: set_version_arch
        run: |
          TAG_NAME=$(git describe --tags --abbrev=0 2>/dev/null)
          if [ -z "$TAG_NAME" ]; then
            TAG_NAME=$(git rev-parse --short HEAD)
          fi
          RELEASE_VERSION="${TAG_NAME#v}"
          
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> $GITHUB_ENV
          echo "DEBUG: Final calculated RELEASE_VERSION via git is '$RELEASE_VERSION'"
          
          echo -n "$RELEASE_VERSION" > .release_version 

      - name: "Build binary and package manually"
        run: |
          RELEASE_VERSION=$(cat .release_version | tr -d '\n\r')

          # 1. Compile the binary
          echo "Compiling binary..."
          gcc aslookup.c -o aslookup -lcurl -lcjson -lresolv -DVERSION=\"\\\"$RELEASE_VERSION\\\"\"
          
          # 2. Create the package directory structure
          PKG_DIR="pkg-arch"
          mkdir -p "$PKG_DIR/usr/bin"
          
          # 3. Install the binary
          echo "Installing binary to $PKG_DIR/usr/bin/..."
          cp aslookup "$PKG_DIR/usr/bin/aslookup"
          
          # 4. Create the Arch package metadata file (.PKGINFO)
          echo "Creating .PKGINFO..."
          # The package version in Arch often includes the pkgrel (e.g., 1.4.1-1)
          PKG_VER_REL="$RELEASE_VERSION-1" 
          cat <<EOF > "$PKG_DIR/.PKGINFO"
          # Generated manually for Arch package
          pkgname = aslookup
          pkgver = $PKG_VER_REL
          pkgdesc = ASN lookup utility
          url = https://codeberg.org/nieldk/aslookup
          builddate = $(date +%s)
          packager = Niel Nielsen <nieldk@gmail.com>
          size = $(du -sb aslookup | awk '{print $1}')
          arch = x86_64
          license = GPL3
          depend = curl
          depend = cjson
          EOF
          
          # 5. Create the .tar.zst package using tar and zstd via pipe
          PKG_FILENAME="aslookup-$PKG_VER_REL-x86_64.pkg.tar.zst"
          echo "Creating final package $PKG_FILENAME using tar and zstd pipe..."
          
          # Use 'tar -C' to change directory, and pipe output directly to zstd.
          tar -C "$PKG_DIR" -cf - . | zstd -T0 -c -q -f > "$PKG_FILENAME"
          
          # Store the filename for the next step via environment variable
          echo "PKG_FILE=$PKG_FILENAME" >> $GITHUB_ENV


      - name: "Upload Arch .pkg.tar.zst"
        env:
          AUTH_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          # --- Environment setup and version retrieval (repeated for isolated job) ---
          GIT_URL=$(git remote get-url origin)
          REPO_SLUG=$(echo "$GIT_URL" | sed -E 's/.*codeberg\.org[:/]([^\/]+\/[^.]+)(\.git)?$/\1/')
          REPO_OWNER=$(echo "$REPO_SLUG" | cut -d/ -f1)
          REPO_NAME=$(echo "$REPO_SLUG" | cut -d/ -f2)
          
          # FIX: Line 235 failed. Removed the unreliable file read and assign the 
          # RELEASE_VERSION from the environment variable set in a previous step.
          # RELEASE_VERSION=$(cat .release_version | tr -d '\n\r')
          RELEASE_VERSION="$RELEASE_VERSION" # Line 239

          RELEASE_TAG="${CI_TAG:-${CI_COMMIT_TAG}}"
          if [ -z "$RELEASE_TAG" ]; then
            RELEASE_TAG="v$RELEASE_VERSION"
          fi
          AUTH_HEADER="Authorization: token ${AUTH_TOKEN}"
          
          # FIX: PKG_FILE_PATH is now retrieved from the exported environment variable PKG_FILE (line 247)
          PKG_FILE_PATH="$PKG_FILE" 
          # --------------------------------------------------------------------------

          echo "DEBUG: Looking for existing release ID..."
          # Check for existing release (same ID for both files)
          RELEASE_ID=$(curl -s -H "$AUTH_HEADER" "https://codeberg.org/api/v1/repos/$REPO_OWNER/$REPO_NAME/releases" | jq -r "if type==\"array\" then .[] | select(.tag_name==\"$RELEASE_TAG\") | .id else empty end")

          if [ -z "$RELEASE_ID" ]; then
              echo "::error::Release ID not found. Check if the 'build-ubuntu' job succeeded."
              exit 1
          fi
          echo "Existing release found with ID: $RELEASE_ID"
          
          # Upload the built .pkg.tar.zst package
          ASSET_NAME=$(basename "$PKG_FILE_PATH")
          UPLOAD_URL="https://codeberg.org/api/v1/repos/$REPO_OWNER/$REPO_NAME/releases/$RELEASE_ID/assets?name=$ASSET_NAME"
          
          echo "Attempting to upload file '$PKG_FILE_PATH' to release ID $RELEASE_ID..."
          # Combining headers and using the standard $AUTH_HEADER variable
          curl -v -X POST \
            -H "$AUTH_HEADER" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@$PKG_FILE_PATH" "$UPLOAD_URL"
          
          echo "Upload attempt finished. Look for 201 Created status code above."
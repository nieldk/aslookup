name: "Build and Release Packages"

on:
  push:
    tags:
      - "*"

jobs:
  # ---------------- Ubuntu (.deb) ----------------
  build-ubuntu:
    # Changed to an available runner label
    runs-on: codeberg-tiny
    steps:
      - name: "Checkout code"
        run: |
          TAG_OR_MAIN="${CI_COMMIT_TAG:-main}"
          git clone --depth 1 --branch "$TAG_OR_MAIN" https://codeberg.org/nieldk/aslookup.git .

      - name: "Install dependencies"
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libcurl4-openssl-dev libcjson-dev dpkg-dev jq curl

      - name: "Set version"
        run: |
          TAG_NAME="${CI_COMMIT_TAG:-${CI_COMMIT_REF_NAME}}"
          TAG_NAME="${TAG_NAME#v}"
          echo "RELEASE_VERSION=$TAG_NAME" >> $GITHUB_ENV

      - name: "Build binary"
        run: gcc aslookup.c -o aslookup -lcurl -lcjson -lresolv -DVERSION="\"$RELEASE_VERSION\""

      - name: "Prepare .deb package"
        run: |
          mkdir -p pkg/usr/local/bin
          cp aslookup pkg/usr/local/bin/
          mkdir -p pkg/DEBIAN
          cat <<EOF > pkg/DEBIAN/control
          Package: aslookup
          Version: $RELEASE_VERSION
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Niel Nielsen <nieldk@gmail.com>
          Description: ASN lookup utility...
          EOF
          dpkg-deb --build pkg

      - name: "Upload Ubuntu .deb"
        run: |
          RELEASE_ID=$(curl -s -H "Authorization: token $CODEBERG_TOKEN" \
            "https://codeberg.org/api/v1/repos/$CI_REPO_OWNER/$CI_REPO_NAME/releases" \
            | jq -r ".[] | select(.tag_name==\"$CI_COMMIT_TAG\") | .id")

          if [ -z "$RELEASE_ID" ]; then
            RELEASE_ID=$(curl -s -X POST \
              -H "Authorization: token $CODEBERG_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"$CI_COMMIT_TAG\",\"name\":\"Release $CI_COMMIT_TAG\"}" \
              "https://codeberg.org/api/v1/repos/$CI_REPO_OWNER/$CI_REPO_NAME/releases" \
              | jq -r .id)
          fi

          curl -s -X POST \
            -H "Authorization: token $CODEBERG_TOKEN" \
            -H "Content-Type: application/vnd.debian.binary-package" \
            --data-binary "@pkg.deb" \
            "https://codeberg.org/api/v1/repos/$CI_REPO_OWNER/$CI_REPO_NAME/releases/$RELEASE_ID/assets?name=aslookup_${RELEASE_VERSION}_amd64.deb"


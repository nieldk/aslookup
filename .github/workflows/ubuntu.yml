
name: "Build and Release Packages"

on:
  push:
    tags:
      - "*"

jobs:
  # ---------------- Ubuntu (.deb) ----------------
  build-ubuntu:
    runs-on: codeberg-tiny
    steps:
      - name: "Checkout code"
        run: |
          git clone --depth 1 --branch "${CI_COMMIT_TAG:-main}" https://codeberg.org/nieldk/aslookup.git .

      - name: "Install dependencies"
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libcurl4-openssl-dev libcjson-dev dpkg-dev jq curl

      - name: "Set version"
        run: |
          TAG_NAME="${CI_COMMIT_TAG:-${CI_COMMIT_REF_NAME}}"
          TAG_NAME="${TAG_NAME#v}"
          echo "RELEASE_VERSION=$TAG_NAME" >> $GITHUB_ENV

      - name: "Build binary"
        run: gcc aslookup.c -o aslookup -lcurl -lcjson -lresolv -DVERSION="\"$RELEASE_VERSION\""

      - name: "Prepare .deb package"
        run: |
          mkdir -p pkg/usr/local/bin
          cp aslookup pkg/usr/local/bin/
          mkdir -p pkg/DEBIAN
          cat <<EOF > pkg/DEBIAN/control
          Package: aslookup
          Version: $RELEASE_VERSION
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Niel Nielsen <nieldk@gmail.com>
          Description: ASN lookup utility
          Depends: libc6, libcurl4, libcjson1
          EOF

      - name: "Build .deb"
        run: dpkg-deb --build pkg aslookup_${RELEASE_VERSION}_amd64.deb

      - name: "Upload .deb to Codeberg Release"
        run: |
          RELEASE_ID=$(curl -s -H "Authorization: token $CODEBERG_TOKEN" \
            "https://codeberg.org/api/v1/repos/${CI_REPO_OWNER}/${CI_REPO_NAME}/releases" \
            | jq -r ".[] | select(.tag_name==\"${CI_COMMIT_TAG}\") | .id")

          if [ -z "$RELEASE_ID" ]; then
            RELEASE_ID=$(curl -s -X POST \
              -H "Authorization: token $CODEBERG_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"${CI_COMMIT_TAG}\",\"name\":\"Release ${CI_COMMIT_TAG}\"}" \
              "https://codeberg.org/api/v1/repos/${CI_REPO_OWNER}/${CI_REPO_NAME}/releases" \
              | jq -r ".id")
          fi

          curl -X POST \
            -H "Authorization: token $CODEBERG_TOKEN" \
            -F "attachment=@aslookup_${RELEASE_VERSION}_amd64.deb" \
            "https://codeberg.org/api/v1/repos/${CI_REPO_OWNER}/${CI_REPO_NAME}/releases/${RELEASE_ID}/assets"

  # ---------------- Arch (.pkg.tar.zst) ----------------
  build-arch:
    runs-on: codeberg-tiny
    steps:
      - name: "Checkout code"
        run: |
          git clone --depth 1 --branch "${CI_COMMIT_TAG:-main}" https://codeberg.org/nieldk/aslookup.git .

      - name: "Set version"
        run: |
          TAG_NAME="${CI_COMMIT_TAG:-${CI_COMMIT_REF_NAME}}"
          TAG_NAME="${TAG_NAME#v}"
          echo "RELEASE_VERSION=$TAG_NAME" >> $GITHUB_ENV

      - name: "Patch PKGBUILD"
        run: sed -i "s|^pkgver=.*|pkgver=${RELEASE_VERSION}|" PKGBUILD

      - name: "Build Arch package in Docker"
        run: |
          docker run --rm -v "$PWD:/build" -w /build archlinux:latest bash -c "
            pacman -Syu --noconfirm base-devel gcc curl cjson &&
            useradd -m builder &&
            chown -R builder:builder /build &&
            su builder -c 'cd /build && makepkg -fs --noconfirm'
          "

      - name: "Find package"
        run: echo "PKGFILE=$(ls *.pkg.tar.zst | head -n1)" >> $GITHUB_ENV

      - name: "Upload Arch package"
        run: |
          RELEASE_ID=$(curl -s -H "Authorization: token $CODEBERG_TOKEN" \
            "https://codeberg.org/api/v1/repos/${CI_REPO_OWNER}/${CI_REPO_NAME}/releases" \
            | jq -r ".[] | select(.tag_name==\"${CI_COMMIT_TAG}\") | .id")

          if [ -z "$RELEASE_ID" ]; then
            RELEASE_ID=$(curl -s -X POST \
              -H "Authorization: token $CODEBERG_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"${CI_COMMIT_TAG}\",\"name\":\"Release ${CI_COMMIT_TAG}\"}" \
              "https://codeberg.org/api/v1/repos/${CI_REPO_OWNER}/${CI_REPO_NAME}/releases" \
              | jq -r ".id")
          fi

          curl -X POST \
            -H "Authorization: token $CODEBERG_TOKEN" \
            -F "attachment=@${PKGFILE}" \
            "https://codeberg.org/api/v1/repos/${CI_REPO_OWNER}/${CI_REPO_NAME}/releases/${RELEASE_ID}/assets"

  # ---------------- Windows (.zip) ----------------
  build-windows:
    runs-on: codeberg-tiny
    steps:
      - name: "Checkout code"
        run: |
          git clone --depth 1 --branch "${CI_COMMIT_TAG:-main}" https://codeberg.org/nieldk/aslookup.git .

      - name: "Install cross-compiler"
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 zip jq curl

      - name: "Set version"
        run: |
          TAG_NAME="${CI_COMMIT_TAG:-${CI_COMMIT_REF_NAME}}"
          TAG_NAME="${TAG_NAME#v}"
          echo "RELEASE_VERSION=$TAG_NAME" >> $GITHUB_ENV

      - name: "Build Windows executable"
        run: |
          x86_64-w64-mingw32-gcc aslookup-win.c cJSON.c -o aslookup-win.exe \
            -lws2_32 -lcurl -DPROGRAM_VERSION="\"$RELEASE_VERSION\""

      - name: "Package executable"
        run: zip aslookup_${RELEASE_VERSION}_win.zip aslookup-win.exe

      - name: "Upload Windows ZIP"
        run: |
          RELEASE_ID=$(curl -s -H "Authorization: token $CODEBERG_TOKEN" \
            "https://codeberg.org/api/v1/repos/${CI_REPO_OWNER}/${CI_REPO_NAME}/releases" \
            | jq -r ".[] | select(.tag_name==\"${CI_COMMIT_TAG}\") | .id")

          if [ -z "$RELEASE_ID" ]; then
            RELEASE_ID=$(curl -s -X POST \
              -H "Authorization: token $CODEBERG_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"${CI_COMMIT_TAG}\",\"name\":\"Release ${CI_COMMIT_TAG}\"}" \
              "https://codeberg.org/api/v1/repos/${CI_REPO_OWNER}/${CI_REPO_NAME}/releases" \
              | jq -r ".id")
          fi

          curl -X POST \
            -H "Authorization: token $CODEBERG_TOKEN" \
            -F "attachment=@aslookup_${RELEASE_VERSION}_win.zip" \
            "https://codeberg.org/api/v1/repos/${CI_REPO_OWNER}/${CI_REPO_NAME}/releases/${RELEASE_ID}/assets"

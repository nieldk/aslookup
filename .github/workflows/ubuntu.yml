name: "Build and Release Packages"

on:
  push:
    tags:
      - "*"

jobs:
  # ---------------- Ubuntu (.deb) ----------------
  build-ubuntu:
    runs-on: codeberg-tiny
    steps:
      - name: "Checkout code"
        run: |
          # Clone the full repository history
          git clone https://codeberg.org/nieldk/aslookup.git .
          # Checkout the specific commit that triggered the build (assuming CI_COMMIT_SHA is set)
          git checkout "$CI_COMMIT_SHA" || true

      - name: "Install dependencies"
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libcurl4-openssl-dev libcjson-dev dpkg-dev jq curl

      - name: "Set version"
        run: |
          # Get the version directly from Git using 'git describe'
          TAG_NAME=$(git describe --tags --abbrev=0 2>/dev/null)

          # Fallback: If no tag is found, use a short commit hash for a version
          if [ -z "$TAG_NAME" ]; then
            TAG_NAME=$(git rev-parse --short HEAD)
          fi

          # Strip leading 'v'
          RELEASE_VERSION="${TAG_NAME#v}"
          
          echo "DEBUG: Final calculated RELEASE_VERSION via git is '$RELEASE_VERSION'"
          
          # Store the calculated version in a temporary file
          echo -n "$RELEASE_VERSION" > .release_version 

      - name: "Build binary"
        run: |
          # Retrieve the version from the file and trim any whitespace/newlines
          RELEASE_VERSION=$(cat .release_version | tr -d '\n\r')
          gcc aslookup.c -o aslookup -lcurl -lcjson -lresolv -DVERSION=\"\\\"$RELEASE_VERSION\\\"\"

      - name: "Prepare .deb package"
        run: |
          # Retrieve the version from the file and trim any whitespace/newlines
          RELEASE_VERSION=$(cat .release_version | tr -d '\n\r')
          
          mkdir -p pkg/usr/local/bin
          cp aslookup pkg/usr/local/bin/
          mkdir -p pkg/DEBIAN
          cat <<EOF > pkg/DEBIAN/control
          Package: aslookup
          Version: $RELEASE_VERSION
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Niel Nielsen <nieldk@gmail.com>
          Description: ASN lookup utility
          EOF
          dpkg-deb --build pkg

      - name: "Upload Ubuntu .deb"
        run: |
          # --- FIX: Extract REPO OWNER/NAME from git remote URL ---
          GIT_URL=$(git remote get-url origin)
          # Parse the URL (handles https://, git@, and ssh:// protocols)
          # Example: https://codeberg.org/nieldk/aslookup.git -> nieldk/aslookup
          REPO_SLUG=$(echo $GIT_URL | sed -E 's/.*codeberg\.org[:/]([^\/]+\/[^.]+)(\.git)?$/\1/')
          REPO_OWNER=$(echo $REPO_SLUG | cut -d/ -f1)
          REPO_NAME=$(echo $REPO_SLUG | cut -d/ -f2)
          # --------------------------------------------------------
          
          # Retrieve the version from the file
          RELEASE_VERSION=$(cat .release_version | tr -d '\n\r')
          
          # Use CI_COMMIT_TAG as the reference for the release tag, with a fallback
          RELEASE_TAG="${CI_TAG:-${CI_COMMIT_TAG}}"
          if [ -z "$RELEASE_TAG" ]; then
            RELEASE_TAG="v$RELEASE_VERSION"
          fi

          echo "DEBUG: Using API URL variables: Owner='$REPO_OWNER', Name='$REPO_NAME', Tag='$RELEASE_TAG'"

          # Check for existing release (safely handles non-JSON/404 responses)
          RELEASE_ID=$(curl -s -H "Authorization: token $CODEBERG_TOKEN" \
            "https://codeberg.org/api/v1/repos/$REPO_OWNER/$REPO_NAME/releases" \
            | jq -r "if type==\"array\" then .[] | select(.tag_name==\"$RELEASE_TAG\") | .id else empty end")

          if [ -z "$RELEASE_ID" ]; then
            echo "Release tag '$RELEASE_TAG' not found, creating new release..."
            
            # Use 'tee' to capture the output while also displaying it (for debug)
            API_RESPONSE=$(curl -s -X POST \
              -H "Authorization: token $CODEBERG_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"$RELEASE_TAG\",\"name\":\"Release $RELEASE_TAG\"}" \
              "https://codeberg.org/api/v1/repos/$REPO_OWNER/$REPO_NAME/releases" | tee /dev/stderr)
              
            # Extract the ID from the (hopefully) successful JSON response
            RELEASE_ID=$(echo "$API_RESPONSE" | jq -r .id)

            if [ "$RELEASE_ID" == "null" ] || [ -z "$RELEASE_ID" ]; then
                echo "::error::Failed to create release. Check the API response above for errors. Full API response: $API_RESPONSE"
                exit 1
            fi
            echo "Created new release with ID: $RELEASE_ID"
          else
            echo "Existing release found with ID: $RELEASE_ID"
          fi
          
          # Upload the built .deb package
          curl -s -X POST \
            -H "Authorization: token $CODEBERG_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@pkg/pkg.deb" \
            "https://codeberg.org/api/v1/repos/$REPO_OWNER/$REPO_NAME/releases/$RELEASE_ID/assets?name=aslookup-$RELEASE_VERSION-ubuntu-amd64.deb"
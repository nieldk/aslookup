name: "Build and Release Packages"

on:
  push:
    tags:
      - "*"

jobs:
  # ---------------- Ubuntu (.deb) ----------------
  build-ubuntu:
    runs-on: codeberg-tiny
    steps:
      - name: "Checkout code"
        run: |
          # Clone the full repository history
          git clone https://codeberg.org/nieldk/aslookup.git .
          # FIX 1: Checkout the specific commit that triggered the build.
          # We must assume the Gitea/Forgejo variable CI_COMMIT_SHA is set.
          git checkout "$CI_COMMIT_SHA" || true

      - name: "Install dependencies"
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libcurl4-openssl-dev libcjson-dev dpkg-dev jq curl

      - name: "Set version"
        run: |
          # FIX 2: Get the version directly from Git using 'git describe'
          # If on a tag, this returns the tag name (e.g., v1.0.0).
          TAG_NAME=$(git describe --tags --abbrev=0 2>/dev/null)

          # Fallback: If no tag is found, use a short commit hash for a version
          if [ -z "$TAG_NAME" ]; then
            TAG_NAME=$(git rev-parse --short HEAD)
          fi

          # Strip leading 'v'
          RELEASE_VERSION="${TAG_NAME#v}"
          
          # Debug: Will show the exact version being used (e.g., 1.0.0 or c837d)
          echo "DEBUG: Final calculated RELEASE_VERSION via git is '$RELEASE_VERSION'"
          
          # Store the calculated version in a temporary file
          echo -n "$RELEASE_VERSION" > .release_version 

      - name: "Build binary"
        run: |
          # Retrieve the version from the file and trim any whitespace/newlines
          RELEASE_VERSION=$(cat .release_version | tr -d '\n\r')
          gcc aslookup.c -o aslookup -lcurl -lcjson -lresolv -DVERSION=\"\\\"$RELEASE_VERSION\\\"\"

      - name: "Prepare .deb package"
        run: |
          # Retrieve the version from the file and trim any whitespace/newlines
          RELEASE_VERSION=$(cat .release_version | tr -d '\n\r')
          
          # $RELEASE_VERSION is now populated from the local Git repo metadata
          mkdir -p pkg/usr/local/bin
          cp aslookup pkg/usr/local/bin/
          mkdir -p pkg/DEBIAN
          cat <<EOF > pkg/DEBIAN/control
          Package: aslookup
          Version: $RELEASE_VERSION
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Niel Nielsen <nieldk@gmail.com>
          Description: ASN lookup utility
          EOF
          dpkg-deb --build pkg

      - name: "Upload Ubuntu .deb"
        run: |
          # Retrieve the version from the file and trim any whitespace/newlines
          RELEASE_VERSION=$(cat .release_version | tr -d '\n\r')
          
          # Use CI_COMMIT_TAG as the reference for the release tag, with a fallback
          RELEASE_TAG="${CI_COMMIT_TAG:-v$RELEASE_VERSION}"

          RELEASE_ID=$(curl -s -H "Authorization: token $CODEBERG_TOKEN" \
            "https://codeberg.org/api/v1/repos/$CI_REPO_OWNER/$CI_REPO_NAME/releases" \
            | jq -r ".[] | select(.tag_name==\"$RELEASE_TAG\") | .id")

          if [ -z "$RELEASE_ID" ]; then
            RELEASE_ID=$(curl -s -X POST \
              -H "Authorization: token $CODEBERG_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"$RELEASE_TAG\",\"name\":\"Release $RELEASE_TAG\"}" \
              "https://codeberg.org/api/v1/repos/$CI_REPO_OWNER/$CI_REPO_NAME/releases" \
              | jq -r .id)
          fi

          curl -s -X POST \
            -H "Authorization: token $CODEBERG_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@pkg.deb" \
            "https://codeberg.org/api/v1/repos/$CI_REPO_OWNER/$CI_REPO_NAME/releases/$RELEASE_ID/assets?name=aslookup-$RELEASE_VERSION-ubuntu-amd64.deb"

name: "Build and Release Debian Package"

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: codeberg-tiny

    steps:
      - name: "Checkout code"
        run: |
          git clone "$CI_REPOSITORY_URL" .
          git checkout "$CI_COMMIT_REF_NAME"

      - name: "Install dependencies"
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libcurl4-openssl-dev libcjson-dev dpkg-dev jq curl

      - name: "Set version from tag"
        run: echo "RELEASE_VERSION=${CI_COMMIT_TAG#v}" >> $GITHUB_ENV

      - name: "Build binary with version"
        run: gcc aslookup.c -o aslookup -lcurl -lcjson -lresolv -DVERSION="\"$RELEASE_VERSION\""

      - name: "Prepare .deb package structure"
        run: |
          mkdir -p pkg/usr/local/bin
          cp aslookup pkg/usr/local/bin/
          mkdir -p pkg/DEBIAN
          cat <<EOF > pkg/DEBIAN/control
          Package: aslookup
          Version: $RELEASE_VERSION
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Niel Nielsen <nieldk@gmail.com>
          Description: ASN lookup utility
          Depends: libc6, libcurl4, libcjson1
          EOF

      - name: "Build .deb package"
        run: dpkg-deb --build pkg aslookup_${RELEASE_VERSION}_amd64.deb

      - name: "Upload .deb to Codeberg Release"
        run: |
          RELEASE_ID=$(curl -s -H "Authorization: token $CODEBERG_TOKEN" \
            "https://codeberg.org/api/v1/repos/${CI_REPO_OWNER}/${CI_REPO_NAME}/releases" \
            | jq -r ".[] | select(.tag_name==\"${CI_COMMIT_TAG}\") | .id")

          if [ -z "$RELEASE_ID" ]; then
            RELEASE_ID=$(curl -s -X POST \
              -H "Authorization: token $CODEBERG_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"${CI_COMMIT_TAG}\",\"name\":\"Release ${CI_COMMIT_TAG}\"}" \
              "https://codeberg.org/api/v1/repos/${CI_REPO_OWNER}/${CI_REPO_NAME}/releases" \
              | jq -r ".id")
          fi

          curl -X POST \
            -H "Authorization: token $CODEBERG_TOKEN" \
            -F "attachment=@aslookup_${RELEASE_VERSION}_amd64.deb" \
            "https://codeberg.org/api/v1/repos/${CI_REPO_OWNER}/${CI_REPO_NAME}/releases/${RELEASE_ID}/assets"

name: Build C Windows Executable

on:
  push:
    branches:
      - main
      # CRITICAL: This line ensures the workflow also runs when a tag is pushed
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

jobs:
  build_windows:
    # Changed runs-on to match your most recent log: codeberg-medium
    runs-on: codeberg-medium 
    
    steps:
      - name: Checkout Repository
        # We must keep this step, relying on the runner's built-in checkout mechanism
        uses: actions/checkout@v4

      # --- 1. Install Core MinGW Toolchain and Build Dependencies ---
      - name: Install MinGW Tools and Build Dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends mingw-w64 gcc-mingw-w64-x86-64 build-essential autoconf libtool xz-utils git
          
      # --- 2. Build Libcurl from Source for MinGW ---
      - name: Download and Build Static Libcurl for MinGW
        run: |
          export TARGET_HOST=x86_64-w64-mingw32
          export CFLAGS="-m64"
          
          curl -L "https://curl.se/download/curl-8.4.0.tar.xz" | tar -xJ
          cd curl-8.4.0
          
          ./buildconf
          
          ./configure \
              --host=$TARGET_HOST \
              --build=x86_64-pc-linux-gnu \
              --disable-shared \
              --enable-static \
              --with-winssl \
              --without-ssl \
              --disable-ldap --disable-ldaps --disable-ftp --disable-file --disable-tftp --disable-pop3 --disable-imap --disable-smtp --disable-rtsp \
              --disable-dict --disable-telnet --disable-samba --disable-mqtt \
              --prefix=$GITHUB_WORKSPACE/curl_build 

          make -j$(nproc)
          make install
          
          mkdir -p $GITHUB_WORKSPACE/lib
          cp $GITHUB_WORKSPACE/curl_build/lib/libcurl.a $GITHUB_WORKSPACE/lib/
          
          mkdir -p $GITHUB_WORKSPACE/mingw-include
          cp -r $GITHUB_WORKSPACE/curl_build/include/* $GITHUB_WORKSPACE/mingw-include/

      # --- 3. Manually Download and Setup cJSON and Dummy Headers ---
      - name: Setup cJSON and Dummy Headers
        run: |
          mkdir -p cjson
          curl -L -o cjson/cJSON.c https://raw.githubusercontent.com/DaveGamble/cJSON/master/cJSON.c
          curl -L -o cjson/cJSON.h https://raw.githubusercontent.com/DaveGamble/cJSON/master/cJSON.h
          
          mkdir -p mingw-include/curl
          touch mingw-include/curl/system.h
          touch mingw-include/curl/header.h
          touch mingw-include/curl/websockets.h
          touch mingw-include/curl/mprintf.h
          touch mingw-include/curl/typecheck-gcc.h
          
      # --- 4. Compile the Windows Executable (FINAL WORKING COMMAND) ---
      - name: Compile aslookup_win.c for Windows
        run: |
          x86_64-w64-mingw32-gcc -o aslookup.exe aslookup_win.c cjson/cJSON.c \
              -D_WIN32_WINNT=0x0600 \
              -DCURL_STATICLIB \
              -D_CRT_DECLARE_NONSTDC_NAMES \
              -I. \
              -I./mingw-include \
              ./lib/libcurl.a \
              -lws2_32 -lmswsock -luser32 \
              -lbcrypt -lcrypt32 -ladvapi32 \
              -liphlpapi \
              -ldnsapi \
              -lpthread \
              -static
              
      - name: Verify Executable
        run: ls -l aslookup.exe

      # --- 5. Upload to Gitea Release via API (Shell) ---
      # Uses the custom secrets you created.
      - name: Upload Binary to Release
        if: startsWith(github.ref, 'refs/tags/') # This must be true for the step to run
        env:
          CODEBERG_PAT: ${{ secrets.CODEBERG_PAT }}        
          API_UPLOAD_BASE: ${{ secrets.UPLOAD_URL_BASE }} 
        run: |
          # 1. Extract Tag Name
          TAG_NAME=${GITHUB_REF##*/}
          FILE_NAME="aslookup.exe"

          echo "Attempting to create and upload release asset for tag: ${TAG_NAME}"

          # 2. Fetch the Release ID for the current tag
          # API call to get release info
          RELEASE_INFO=$(curl -s -X GET \
              -H "Authorization: token ${CODEBERG_PAT}" \
              "${API_UPLOAD_BASE}/tags/${TAG_NAME}")

          # Parse the ID from the JSON response
          # We use head -1 to ensure we only get the first ID found
          RELEASE_ID=$(echo "${RELEASE_INFO}" | grep -o '"id":[0-9]*' | head -1 | grep -o '[0-9]*')

          if [ -z "$RELEASE_ID" ]; then
              echo "❌ ERROR: Could not find Release ID for tag ${TAG_NAME}."
              echo "Please ensure you pushed a valid tag (e.g., 'git push --tags') and that the UPLOAD_URL_BASE secret is correct."
              exit 1
          fi

          echo "Found Release ID: ${RELEASE_ID}. Uploading asset..."

          # 3. Upload the Asset
          UPLOAD_ENDPOINT="${API_UPLOAD_BASE}/${RELEASE_ID}/assets?name=${FILE_NAME}"

          # Use curl with -w "%{http_code}" to check the result code
          UPLOAD_RESPONSE=$(curl -s -w "%{http_code}" -X POST \
              -H "Authorization: token ${CODEBERG_PAT}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@${FILE_NAME}" \
              "${UPLOAD_ENDPOINT}")
          
          # Check HTTP response code 
          HTTP_CODE="${UPLOAD_RESPONSE: -3}"
          
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -le 299 ]; then
              echo "✅ Successfully uploaded ${FILE_NAME} to release ${TAG_NAME}."
          else
              echo "❌ ERROR: Asset upload failed with HTTP status code ${HTTP_CODE}."
              echo "Response: ${UPLOAD_RESPONSE%???}" # Print response body without HTTP code
              exit 1
          fi
name: Build C Windows Executable

on:
  push:
    branches:
      - main
    tags: 
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

jobs:
  build_windows:
    runs-on: codeberg-medium 
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # --- 1. Install Core MinGW Toolchain and Build Dependencies ---
      - name: Install MinGW Tools and Build Dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends \
            mingw-w64 \
            gcc-mingw-w64-x86-64 \
            build-essential \
            autoconf \
            libtool \
            xz-utils \
            git

      # --- 2. Build Libcurl from Source for MinGW (SSL CONFLICT FIXED) ---
      - name: Download and Build Static Libcurl for MinGW
        run: |
          export TARGET_HOST=x86_64-w64-mingw32
          # CRITICAL FIX 1: Set -DUSE_SCHANNEL to enable WinSSL code paths.
          export CFLAGS="-m64 -DUSE_SCHANNEL" 
          
          curl -L "https://curl.se/download/curl-8.4.0.tar.xz" | tar -xJ
          cd curl-8.4.0
          
          ./buildconf
          
          # Configure with Schannel, static linking, and without unnecessary protocols
          ./configure \
              --host=$TARGET_HOST \
              --build=x86_64-pc-linux-gnu \
              --disable-shared \
              --enable-static \
              --with-schannel \
              --disable-ldap --disable-ldaps --disable-ftp --disable-file --disable-tftp --disable-pop3 --disable-imap --disable-smtp --disable-rtsp \
              --disable-dict --disable-telnet --disable-samba --disable-mqtt \
              --prefix=$GITHUB_WORKSPACE/curl_build 

          make -j$(nproc)
          make install
          
          mkdir -p $GITHUB_WORKSPACE/lib
          cp $GITHUB_WORKSPACE/curl_build/lib/libcurl.a $GITHUB_WORKSPACE/lib/
          

      # --- 3. Download cJSON and cURL Headers Locally ---
      - name: Download cJSON and cURL Headers Locally
        run: |
          # 3a: Setup cJSON (Source files)
          mkdir -p cjson
          curl -L -o cjson/cJSON.c https://raw.githubusercontent.com/DaveGamble/cJSON/master/cJSON.c
          curl -L -o cjson/cJSON.h https://raw.githubusercontent.com/DaveGamble/cJSON/master/cJSON.h
          
          # 3b: Setup cURL Headers (Local injection)
          mkdir -p mingw-include
          cp -r $GITHUB_WORKSPACE/curl_build/include/* $GITHUB_WORKSPACE/mingw-include/


      # --- 4. Compile the Windows Executable (FINAL SCHANNEL FIX) ---
      - name: Compile aslookup.exe for Windows (Final Schannel Fix)
        run: |
          # Added compatibility definitions (WINVER, _WIN32_IE) and explicit -lwsock32 link.
          x86_64-w64-mingw32-gcc -o aslookup.exe aslookup_win.c cjson/cJSON.c \
              -D_WIN32_WINNT=0x0600 \
              -DWINVER=0x0600 \
              -D_WIN32_IE=0x0600 \
              -DCURL_STATICLIB \
              -D_CRT_DECLARE_NONSTDC_NAMES \
              -I. \
              -I./mingw-include \
              ./lib/libcurl.a \
              -lws2_32 -lwsock32 -lmswsock -luser32 \
              -lbcrypt -lcrypt32 -ladvapi32 \
              -liphlpapi \
              -ldnsapi \
              -lpthread \
              -static

      - name: Verify Windows Executable and Package
        run: |
          ls -l aslookup.exe
          echo "✅ Compilation successful. Creating tarball for easy download."
          tar -czf aslookup-windows.tar.gz aslookup.exe
          ls -l aslookup-windows.tar.gz
          
      # --- 5. Upload Binary to Gitea Release (API Only) ---
      - name: Upload Binary to Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          CODEBERG_PAT: ${{ secrets.CODEBERG_PAT }}        
          API_UPLOAD_BASE: ${{ secrets.UPLOAD_URL_BASE }} 
        run: |
          TAG_NAME=${GITHUB_REF##*/}
          FILE_NAME="aslookup.exe" 

          echo "Attempting upload for tag: ${TAG_NAME}"
          
          if [ ! -f "${FILE_NAME}" ]; then
              echo "❌ ERROR: Executable file '${FILE_NAME}' not found. Check compilation step."
              exit 1
          fi

          # 1. Fetch the Release ID for the current tag
          GET_URL="${API_UPLOAD_BASE}/tags/${TAG_NAME}"
          
          RELEASE_INFO=$(curl -s -X GET \
              -H "Authorization: token ${CODEBERG_PAT}" \
              "${GET_URL}")

          # Parse the ID from the JSON response
          RELEASE_ID=$(echo "${RELEASE_INFO}" | grep -o '"id":[0-9]*' | head -1 | grep -o '[0-9]*')

          if [ -z "$RELEASE_ID" ]; then
              echo "❌ ERROR: Could not find Release ID for tag ${TAG_NAME}."
              exit 1
          fi

          echo "Found Release ID: ${RELEASE_ID}. Uploading asset..."

          # 2. Upload the Asset
          UPLOAD_ENDPOINT="${API_UPLOAD_BASE}/${RELEASE_ID}/assets?name=${FILE_NAME}"

          UPLOAD_RESPONSE=$(curl -s -w "%{http_code}" -X POST \
              -H "Authorization: token ${CODEBERG_PAT}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@${FILE_NAME}" \
              "${UPLOAD_ENDPOINT}")
          
          # Check HTTP response code 
          HTTP_CODE="${UPLOAD_RESPONSE: -3}"
          
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -le 299 ]; then
              echo "✅ Successfully uploaded ${FILE_NAME} to release ${TAG_NAME}."
          else
              echo "❌ ERROR: Asset upload failed with HTTP status code ${HTTP_CODE}."
              echo "Response: ${UPLOAD_RESPONSE%???}" 
              exit 1
          fi
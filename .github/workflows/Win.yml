name: Build C Windows Executable

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_windows:
    # Changed runs-on from 'codeberg-tiny' to 'codeberg-medium' in your old file, maintaining 'tiny' here based on your latest log
    runs-on: codeberg-tiny 
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # --- 1. Install Core MinGW Toolchain and Build Dependencies ---
      - name: Install MinGW Tools and Build Dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends mingw-w64 gcc-mingw-w64-x86-64 build-essential autoconf libtool xz-utils git
          
      # --- 2. Build Libcurl from Source for MinGW ---
      - name: Download and Build Static Libcurl for MinGW
        run: |
          export TARGET_HOST=x86_64-w64-mingw32
          export CFLAGS="-m64"
          
          # Download source archive from a reliable mirror and extract.
          curl -L "https://curl.se/download/curl-8.4.0.tar.xz" | tar -xJ
          cd curl-8.4.0
          
          ./buildconf
          
          ./configure \
              --host=$TARGET_HOST \
              --build=x86_64-pc-linux-gnu \
              --disable-shared \
              --enable-static \
              --with-winssl \
              --without-ssl \
              --disable-ldap --disable-ldaps --disable-ftp --disable-file --disable-tftp --disable-pop3 --disable-imap --disable-smtp --disable-rtsp \
              --disable-dict --disable-telnet --disable-samba --disable-mqtt \
              --prefix=$GITHUB_WORKSPACE/curl_build 

          make -j$(nproc)
          make install
          
          mkdir -p $GITHUB_WORKSPACE/lib
          cp $GITHUB_WORKSPACE/curl_build/lib/libcurl.a $GITHUB_WORKSPACE/lib/
          
          mkdir -p $GITHUB_WORKSPACE/mingw-include
          cp -r $GITHUB_WORKSPACE/curl_build/include/* $GITHUB_WORKSPACE/mingw-include/

      # --- 3. Manually Download and Setup Dependencies ---
      - name: Download cJSON and cURL Headers Locally
        run: |
          mkdir -p cjson
          curl -L -o cjson/cJSON.c https://raw.githubusercontent.com/DaveGamble/cJSON/master/cJSON.c
          curl -L -o cjson/cJSON.h https://raw.githubusercontent.com/DaveGamble/cJSON/master/cJSON.h
          
          mkdir -p mingw-include/curl
          touch mingw-include/curl/system.h
          touch mingw-include/curl/header.h
          touch mingw-include/curl/websockets.h
          touch mingw-include/curl/mprintf.h
          touch mingw-include/curl/typecheck-gcc.h
          
      # --- 4. Compile the Windows Executable (FINAL SUCCESSFUL LINKER COMMAND) ---
      - name: Compile aslookup_win.c for Windows
        run: |
          # This command includes the final linker fix for pthread, DNS, and WinSSL dependencies.
          x86_64-w64-mingw32-gcc -o aslookup.exe aslookup_win.c cjson/cJSON.c \
              -D_WIN32_WINNT=0x0600 \
              -DCURL_STATICLIB \
              -D_CRT_DECLARE_NONSTDC_NAMES \
              -I. \
              -I./mingw-include \
              ./lib/libcurl.a \
              -lws2_32 -lmswsock -luser32 \
              -lbcrypt -lcrypt32 -ladvapi32 \
              -liphlpapi \
              -ldnsapi \
              -lpthread \
              -static
              
      - name: Verify Windows Executable and Confirm Success
        run: |
          ls -l aslookup.exe
          echo "✅ Compilation successful. Executable is available in the run directory."
          
      # --- 5. Upload Artifact (For simple job output/temporary storage) ---
      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aslookup-windows-artifact
          path: aslookup.exe

      # --- 6. CRITICAL FIX: Create and Upload to a Release ---
      # This step creates a permanent release entry and attaches the binary to it.
      # It will only run if the workflow was triggered by pushing a tag (e.g., v1.0.0).
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: aslookup.exe
          prerelease: false # Use 'false' for a final release
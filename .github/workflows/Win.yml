name: Build C Windows Executable

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_windows:
    runs-on: codeberg-tiny 
    
    steps:
      # --- 1. Checkout Repository (Manual using Shell) ---
      # Replaces 'uses: actions/checkout@v4' which your runner cannot find.
      - name: Manual Checkout
        run: |
          # Use GITHUB_REPOSITORY to clone the repo from your current server.
          # Note: The $GITHUB_WORKSPACE environment variable is pre-set by the runner.
          git clone --depth 1 $GITHUB_SERVER_URL/$GITHUB_REPOSITORY $GITHUB_WORKSPACE
          cd $GITHUB_WORKSPACE

      # --- 2. Install Core MinGW Toolchain and Build Dependencies ---
      - name: Install MinGW Tools and Build Dependencies
        run: |
          # Install all necessary tools, including build system, mingw, and xz for extraction
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends mingw-w64 gcc-mingw-w64-x86-64 build-essential autoconf libtool xz-utils git
          
      # --- 3. Build Libcurl from Source for MinGW ---
      - name: Download and Build Static Libcurl for MinGW
        run: |
          export TARGET_HOST=x86_64-w64-mingw32
          export CFLAGS="-m64"
          
          # Download source archive (fastest and most reliable method)
          curl -L "https://curl.se/download/curl-8.4.0.tar.xz" | tar -xJ
          cd curl-8.4.0
          
          ./buildconf
          
          # Configure for static cross-compilation with WinSSL
          ./configure \
              --host=$TARGET_HOST \
              --build=x86_64-pc-linux-gnu \
              --disable-shared \
              --enable-static \
              --with-winssl \
              --without-ssl \
              --disable-ldap --disable-ldaps --disable-ftp --disable-file --disable-tftp --disable-pop3 --disable-imap --disable-smtp --disable-rtsp \
              --disable-dict --disable-telnet --disable-samba --disable-mqtt \
              --prefix=$GITHUB_WORKSPACE/curl_build 

          make -j$(nproc)
          make install
          
          # Copy results to final locations
          mkdir -p $GITHUB_WORKSPACE/lib
          cp $GITHUB_WORKSPACE/curl_build/lib/libcurl.a $GITHUB_WORKSPACE/lib/
          
          mkdir -p $GITHUB_WORKSPACE/mingw-include
          cp -r $GITHUB_WORKSPACE/curl_build/include/* $GITHUB_WORKSPACE/mingw-include/

      # --- 4. Manually Download and Setup cJSON and Dummy Headers ---
      - name: Setup cJSON and Dummy Headers
        run: |
          mkdir -p cjson
          curl -L -o cjson/cJSON.c https://raw.githubusercontent.com/DaveGamble/cJSON/master/cJSON.c
          curl -L -o cjson/cJSON.h https://raw.githubusercontent.com/DaveGamble/cJSON/master/cJSON.h
          
          mkdir -p mingw-include/curl
          touch mingw-include/curl/system.h
          touch mingw-include/curl/header.h
          touch mingw-include/curl/websockets.h
          touch mingw-include/curl/mprintf.h
          touch mingw-include/curl/typecheck-gcc.h
          
      # --- 5. Compile the Windows Executable (FINAL WORKING COMMAND) ---
      - name: Compile aslookup_win.c for Windows
        run: |
          # Final linker command to resolve all dependencies: libcurl, WinSSL, DNS, and pthread.
          x86_64-w64-mingw32-gcc -o aslookup_win.exe aslookup_win.c cjson/cJSON.c \
              -D_WIN32_WINNT=0x0600 \
              -DCURL_STATICLIB \
              -D_CRT_DECLARE_NONSTDC_NAMES \
              -I. \
              -I./mingw-include \
              ./lib/libcurl.a \
              -lws2_32 -lmswsock -luser32 \
              -lbcrypt -lcrypt32 -ladvapi32 \
              -liphlpapi \
              -ldnsapi \
              -lpthread \
              -static
              
      - name: Verify and Package Executable
        run: |
          ls -l aslookup_win.exe
          echo "✅ Compilation successful. Creating tarball for easy download."
          # Create a compressed archive of the executable for easy download from the run log
          tar -czf aslookup-windows.tar.gz aslookup_win.exe
          ls -l aslookup-windows.tar.gz
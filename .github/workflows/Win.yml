name: Build C Windows Executable

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_windows:
    runs-on: codeberg-medium
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # --- 1. Install Core MinGW Toolchain and Build Dependencies ---
      - name: Install MinGW Tools and Build Dependencies
        run: |
          # CRITICAL FIX: Added 'xz-utils' to handle the compressed source archive.
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends mingw-w64 gcc-mingw-w64-x86-64 build-essential autoconf libtool xz-utils
          
      # --- 2. Build Libcurl from Source for MinGW (Bypass Git Timeout) ---
      - name: Download and Build Static Libcurl for MinGW
        run: |
          export TARGET_HOST=x86_64-w64-mingw32
          export CFLAGS="-m64"
          
          # CRITICAL FIX: Download compressed source archive from a reliable mirror and extract.
          # This is the fastest way to get the source and avoids Git timeout issues.
          curl -L "https://curl.se/download/curl-8.4.0.tar.xz" | tar -xJ

          # Change to the extracted directory
          cd curl-8.4.0
          
          # Generate the missing 'configure' script using the buildconf utility.
          # This ensures all necessary files for configuration are present.
          ./buildconf
          
          # Configure for static cross-compilation
          ./configure \
              --host=$TARGET_HOST \
              --build=x86_64-pc-linux-gnu \
              --disable-shared \
              --enable-static \
              --with-winssl \
              --without-ssl \
              --disable-ldap --disable-ldaps --disable-ftp --disable-file --disable-tftp --disable-pop3 --disable-imap --disable-smtp --disable-rtsp \
              --disable-dict --disable-telnet --disable-samba --disable-mqtt \
              --prefix=$GITHUB_WORKSPACE/curl_build 

          # Compile and install
          make -j$(nproc)
          make install
          
          # Move the library to the expected location
          mkdir -p $GITHUB_WORKSPACE/lib
          cp $GITHUB_WORKSPACE/curl_build/lib/libcurl.a $GITHUB_WORKSPACE/lib/
          
          # Copy headers
          mkdir -p $GITHUB_WORKSPACE/mingw-include
          cp -r $GITHUB_WORKSPACE/curl_build/include/* $GITHUB_WORKSPACE/mingw-include/

      # --- 3. Manually Download and Setup Dependencies (Minimal Cleanup) ---
      - name: Download cJSON and cURL Headers Locally
        run: |
          # 3a: Setup cJSON (Source files)
          mkdir -p cjson
          curl -L -o cjson/cJSON.c https://raw.githubusercontent.com/DaveGamble/cJSON/master/cJSON.c
          curl -L -o cjson/cJSON.h https://raw.githubusercontent.com/DaveGamble/cJSON/master/cJSON.h
          
          # 3b: Setup cURL Headers (Dummy files only)
          mkdir -p mingw-include/curl
          # Create DUMMY files for all known generated/unreliable cURL headers.
          touch mingw-include/curl/system.h
          touch mingw-include/curl/header.h
          touch mingw-include/curl/websockets.h
          touch mingw-include/curl/mprintf.h
          touch mingw-include/curl/typecheck-gcc.h
          
      # --- 4. Compile the Windows Executable (FINAL COMMAND) ---
      - name: Compile aslookup_win.c for Windows
        run: |
          # Uses all necessary flags for MinGW cross-compilation
          # CRITICAL FIX: Removed conflicting macros and added WinSSL linker dependencies.
          x86_64-w64-mingw32-gcc -o aslookup_win.exe aslookup_win.c cjson/cJSON.c \
              -D_WIN32_WINNT=0x0600 \
              -DCURL_STATICLIB \
              -D_CRT_DECLARE_NONSTDC_NAMES \
              -I. \
              -I./mingw-include \
              ./lib/libcurl.a -lws2_32 -ldnsapi -lbcrypt -ladvapi32 -lcrypt32 -static

      - name: Verify Windows Executable Size
        run: ls -l aslookup_win.exe
          
      - name: Upload Windows Executable
        uses: actions/upload-artifact@v4
        with:
          name: aslookup-windows
          path: aslookup_win.exe

      - name: Verify Windows Executable Size
        run: ls -l aslookup_win.exe
          
      - name: Upload Windows Executable
        uses: actions/upload-artifact@v4
        with:
          name: aslookup-windows
          path: aslookup_win.exe

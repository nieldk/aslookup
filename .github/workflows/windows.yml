name: Build C Windows Executable

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_windows:
    runs-on: codeberg-tiny
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # --- 1. Install Core MinGW Toolchain (Bare Minimum) ---
      - name: Install Core MinGW Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends \
            mingw-w64 \
            gcc-mingw-w64-x86-64
          
      # --- 2. Manually Download and Setup Dependencies ---
      - name: Download cJSON, cURL Headers, and Static Libcurl
        run: |
          # 2a: Setup cJSON (Source files)
          mkdir -p cjson
          curl -L -o cjson/cJSON.c https://raw.githubusercontent.com/DaveGamble/cJSON/master/cJSON.c
          curl -L -o cjson/cJSON.h https://raw.githubusercontent.com/DaveGamble/cJSON/master/cJSON.h
          
          # 2b: Setup cURL Headers (Local injection)
          mkdir -p mingw-include/curl
          # Download ALL core cURL headers:
          curl -L -o mingw-include/curl/curl.h https://raw.githubusercontent.com/curl/curl/master/include/curl/curl.h
          curl -L -o mingw-include/curl/curlver.h https://raw.githubusercontent.com/curl/curl/master/include/curl/curlver.h
          curl -L -o mingw-include/curl/easy.h https://raw.githubusercontent.com/curl/curl/master/include/curl/easy.h
          curl -L -o mingw-include/curl/multi.h https://raw.githubusercontent.com/curl/curl/master/include/curl/multi.h
          curl -L -o mingw-include/curl/urlapi.h https://raw.githubusercontent.com/curl/curl/master/include/curl/urlapi.h 
          curl -L -o mingw-include/curl/options.h https://raw.githubusercontent.com/curl/curl/master/include/curl/options.h
          # Create DUMMY files for all known generated/unreliable cURL headers.
          touch mingw-include/curl/system.h
          touch mingw-include/curl/header.h
          touch mingw-include/curl/websockets.h
          touch mingw-include/curl/mprintf.h
          touch mingw-include/curl/typecheck-gcc.h
          
          # CRITICAL FIX: Manually download a MinGW-compatible static libcurl library (libcurl.a)
          # We use a known-good source for MinGW-w64 static builds.
          mkdir -p lib
          # Download the 64-bit static library (v8.7.1, OpenSSL-based)
          curl -L -o lib/libcurl.a https://github.com/nieldk/misc-binaries/raw/main/libcurl_x86_64_static_8_7_1.a

      # --- 3. Compile the Windows Executable (FINAL COMMAND) ---
      - name: Compile aslookup_win.c for Windows
        run: |
          # Uses all necessary flags for MinGW cross-compilation
          # CRITICAL FIX: Link directly to the downloaded lib/libcurl.a file
          x86_64-w64-mingw32-gcc -o aslookup_win.exe aslookup_win.c cjson/cJSON.c \
              -D_WIN32_WINNT=0x0600 \
              -DCURL_STATICLIB \
              -DCURL_IS_STATIC \
              -Dcurl_off_t="long long" \
              -D_CRT_DECLARE_NONSTDC_NAMES \
              -I. \
              -I./mingw-include \
              ./lib/libcurl.a -lws2_32 -ldnsapi -static

      - name: Verify Windows Executable Size
        run: ls -l aslookup_win.exe
          
      - name: Upload Windows Executable
        uses: actions/upload-artifact@v4
        with:
          name: aslookup-windows
          path: aslookup_win.exe
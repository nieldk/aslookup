name: Build C Windows Executable

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_windows:
    # Stick with the small runner, but optimize for speed
    runs-on: codeberg-small 
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # --- 1. Install Core MinGW Toolchain (Bare Minimum and Fastest) ---
      # This is the single, optimized command for the core cross-compiler.
      - name: Install Core MinGW Tools
        run: |
          # Only install the core meta-package and the compiler to save time
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends \
            mingw-w64 \
            gcc-mingw-w64-x86-64
          
      # --- 2. Manually Install cJSON Source ---
      # This is fast and reliable, avoiding apt package dependency issues.
      - name: Download cJSON Source
        run: |
          curl -LO https://raw.githubusercontent.com/DaveGamble/cJSON/master/cJSON.c
          curl -LO https://raw.githubusercontent.com/DaveGamble/cJSON/master/cJSON.h
          
      # --- 3. Compile the Windows Executable ---
      - name: Compile aslookup_win.c for Windows
        run: |
          # Compile your file, the cJSON source, and link necessary Windows libraries.
          x86_64-w64-mingw32-gcc -o aslookup_win.exe aslookup_win.c cJSON.c \
              -lcurl -lws2_32 -ldnsapi -static

      - name: Verify Windows Executable Size
        run: ls -l aslookup_win.exe
          
      - name: Upload Windows Executable
        # Must rely on a manually cloned or Codeberg-compatible artifact upload action if the standard one fails.
        # This will proceed even if the standard action is only partially compatible.
        uses: actions/upload-artifact@v4
        with:
          name: aslookup-windows
          path: aslookup_win.exe
name: Build C Windows Executable

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_windows:
    runs-on: codeberg-tiny
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # --- 1. Install Core MinGW Toolchain (ABSOLUTE BARE MINIMUM) ---
      - name: Install Core MinGW Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends \
            mingw-w64 \
            gcc-mingw-w64-x86-64

      # --- 2. Download Dependencies Locally (The Fix for 'No such file or directory') ---
      - name: Download cJSON and cURL Headers Locally
        run: |
          # 2a: Setup cJSON (Source files)
          curl -LO https://raw.githubusercontent.com/DaveGamble/cJSON/master/cJSON.c
          curl -LO https://raw.githubusercontent.com/DaveGamble/cJSON/master/cJSON.h
          
          # 2b: Setup cURL Headers (Local injection, avoids system path issues)
          # Create local folder structure: ./mingw-include/curl
          mkdir -p mingw-include/curl
          
          # Download all required curl headers into the local folder
          curl -L -o mingw-include/curl/curl.h https://raw.githubusercontent.com/curl/curl/master/include/curl/curl.h
          curl -L -o mingw-include/curl/curlver.h https://raw.githubusercontent.com/curl/curl/master/include/curl/curlver.h
          curl -L -o mingw-include/curl/easy.h https://raw.githubusercontent.com/curl/curl/master/include/curl/easy.h
          curl -L -o mingw-include/curl/multi.h https://raw.githubusercontent.com/curl/curl/master/include/curl/multi.h
          curl -L -o mingw-include/curl/urlapi.h https://raw.githubusercontent.com/curl/curl/master/include/curl/urlapi.h 
          
      # --- 3. Compile the Windows Executable ---
      - name: Compile aslookup_win.c for Windows
        run: |
          # -I./mingw-include tells the compiler where to find the local headers
          # -DCURL_STATICLIB helps resolve linker issues with MinGW
          x86_64-w64-mingw32-gcc -o aslookup_win.exe aslookup_win.c cJSON.c \
              -D_WIN32_WINNT=0x0600 \
              -DCURL_STATICLIB \
              -I. \
              -I./mingw-include \
              -lcurl -lws2_32 -ldnsapi -static

      - name: Verify Windows Executable Size
        run: ls -l aslookup_win.exe
          
      - name: Upload Windows Executable
        uses: actions/upload-artifact@v4
        with:
          name: aslookup-windows
          path: aslookup_win.exe
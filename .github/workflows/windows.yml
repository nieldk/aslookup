name: Build C Windows Executable

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_windows:
    runs-on: codeberg-tiny
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # --- 1. Install Core MinGW Toolchain (ABSOLUTE BARE MINIMUM) ---
      # This is fast and provides the essential cross-compiler executable and its system paths.
      - name: Install Core MinGW Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends \
            mingw-w64 \
            gcc-mingw-w64-x86-64

      # --- 2. Manually Setup ONLY cJSON Dependency (cURL manual setup is removed!) ---
      # cJSON is simple (two files) and known to work with manual download.
      - name: Download cJSON Source
        run: |
          curl -LO https://raw.githubusercontent.com/DaveGamble/cJSON/master/cJSON.c
          curl -LO https://raw.githubusercontent.com/DaveGamble/cJSON/master/cJSON.h
          
      # --- 3. Compile the Windows Executable (FINAL COMMAND FIX) ---
      - name: Compile aslookup_win.c for Windows
        run: |
          # The fix:
          # -I/usr/x86_64-w64-mingw32/include forces the compiler to search the system's MinGW header path.
          # The compiler should now find curl/curl.h and all its dependencies (system.h, urlapi.h, etc.) here.
          x86_64-w64-mingw32-gcc -o aslookup_win.exe aslookup_win.c cJSON.c \
              -D_WIN32_WINNT=0x0600 \
              -I. \
              -I/usr/x86_64-w64-mingw32/include \
              -lcurl -lws2_32 -ldnsapi -static

      - name: Verify Windows Executable Size
        run: ls -l aslookup_win.exe
          
      - name: Upload Windows Executable
        uses: actions/upload-artifact@v4
        with:
          name: aslookup-windows
          path: aslookup_win.exe
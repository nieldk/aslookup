name: Build C Windows Executable

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_windows:
    runs-on: codeberg-small 
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # --- 1. Install Core MinGW Toolchain ---
      # This is the single, optimized command for the core cross-compiler.
      - name: Install Core MinGW Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends \
            mingw-w64 \
            gcc-mingw-w64-x86-64 \
            # Explicitly install the libcurl headers for the base Linux environment.
            # We hope this is enough for the cross-compiler to find the necessary files.
            libcurl4-openssl-dev
          
      # --- 2. Manually Install cJSON Source and create curl directory ---
      # Downloads the small cJSON source files directly.
      - name: Download cJSON Source and Setup Curl Header Directory
        run: |
          # Download cJSON source
          curl -LO https://raw.githubusercontent.com/DaveGamble/cJSON/master/cJSON.c
          curl -LO https://raw.githubusercontent.com/DaveGamble/cJSON/master/cJSON.h
          
          # Create the expected directory for the curl header
          mkdir -p curl
          
      # --- 3. Compile the Windows Executable ---
      - name: Compile aslookup_win.c for Windows
        run: |
          # The -I. flag tells the compiler to look in the current directory for headers (like cJSON.h).
          # We need to manually link the ws2_32 and gdi32 libraries for the Mingw-w64 curl.
          x86_64-w64-mingw32-gcc -o aslookup_win.exe aslookup_win.c cJSON.c \
              -lcurl -lws2_32 -ldnsapi -static

      - name: Verify Windows Executable Size
        run: ls -l aslookup_win.exe
          
      - name: Upload Windows Executable
        uses: actions/upload-artifact@v4
        with:
          name: aslookup-windows
          path: aslookup_win.exe
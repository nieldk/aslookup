name: Build C Windows Executable

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_windows:
    runs-on: codeberg-tiny
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # --- 1. Install MinGW and Linux cURL Headers ---
      # We install the Linux headers to steal the files we need.
      - name: Install Core MinGW Tools and Linux cURL Dev
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends \
            mingw-w64 \
            gcc-mingw-w64-x86-64 \
            libcurl4-openssl-dev # This provides the /usr/include/curl/ directory

      # --- 2. Manually Setup ONLY cJSON (Source files) ---
      - name: Download cJSON Source
        run: |
          curl -LO https://raw.githubusercontent.com/DaveGamble/cJSON/master/cJSON.c
          curl -LO https://raw.githubusercontent.com/DaveGamble/cJSON/master/cJSON.h
          
      # --- 3. FIX: Copy Linux cURL Headers into MinGW Include Path ---
      - name: Copy cURL Headers to MinGW Directory
        run: |
          # MinGW expects the headers to be found inside its own directory structure
          TARGET_DIR="/usr/x86_64-w64-mingw32/include/curl"
          SOURCE_DIR="/usr/include/curl"
          
          # Create the target subdirectory
          sudo mkdir -p "${TARGET_DIR}"
          
          # Copy all the .h files from the Linux package into the MinGW path
          sudo cp -r "${SOURCE_DIR}/"*.h "${TARGET_DIR}/"

      # --- 4. Compile the Windows Executable ---
      - name: Compile aslookup_win.c for Windows
        run: |
          # The compiler should now find <curl/curl.h> in the MinGW system path.
          x86_64-w64-mingw32-gcc -o aslookup_win.exe aslookup_win.c cJSON.c \
              -D_WIN32_WINNT=0x0600 \
              -I. \
              -lcurl -lws2_32 -ldnsapi -static

      - name: Verify Windows Executable Size
        run: ls -l aslookup_win.exe
          
      - name: Upload Windows Executable
        uses: actions/upload-artifact@v4
        with:
          name: aslookup-windows
          path: aslookup_win.exe
name: Build C Windows Executable

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_windows:
    # Stick with the 'codeberg-small' runner
    runs-on: codeberg-small 
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # --- 1. Install MinGW and Libraries (Optimized for Speed) ---
      # This combines the update and install to a single, faster operation 
      # and uses the full package names to avoid searching.
      - name: Install MinGW and Libraries
        # Use apt-get and --no-install-recommends to keep the install lean
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc-mingw-w64-x86-64 \
            libcurl4-gnutls-dev \
            libcjson-dev
          
      # --- 2. Compile the Windows Executable using the Cross-Compiler ---
      - name: Compile aslookup_win.c for Windows
        run: |
          # The cross-compiler binary: x86_64-w64-mingw32-gcc
          x86_64-w64-mingw32-gcc -o aslookup_win.exe aslookup_win.c \
              -lcurl -lcjson \
              -lws2_32 -ldnsapi

      - name: Verify Windows Executable Size
        run: ls -l aslookup_win.exe
          
      - name: Upload Windows Executable
        uses: actions/upload-artifact@v4
        with:
          name: aslookup-windows
          path: aslookup_win.exe
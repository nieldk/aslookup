name: Build C Windows Executable

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_windows:
    runs-on: codeberg-small 
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # --- 1. Install MinGW Toolchain and Cross-Libs (Optimized) ---
      # Combined into one command to minimize execution time overhead.
      - name: Install MinGW Toolchain and Cross-Libs
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends \
            mingw-w64 \
            gcc-mingw-w64-x86-64 \
            libcurl4-mingw-w64-dev \
            libcjson-mingw-w64-dev
          
      # --- 2. Compile the Windows Executable using the Cross-Compiler ---
      - name: Compile aslookup_win.c for Windows
        # Ensure 'aslookup_win.c' (with an UNDERSCORE) is used to match your file 
        run: |
          # Use the MinGW cross-compiler binary
          x86_64-w64-mingw32-gcc -o aslookup_win.exe aslookup_win.c \
              -lcurl -lcjson \
              -lws2_32 -ldnsapi

      - name: Verify Windows Executable Size
        run: ls -l aslookup_win.exe
          
      - name: Upload Windows Executable
        uses: actions/upload-artifact@v4
        with:
          name: aslookup-windows
          path: aslookup_win.exe
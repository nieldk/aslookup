name: Build C Windows Executable

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_windows:
    runs-on: codeberg-small 
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # --- 1. Install MinGW Toolchain and Cross-Libs (Most Robust Method) ---
      # This explicitly installs the core mingw-w64 package first.
      - name: Install MinGW Toolchain and Cross-Libs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            # Install the meta-package for MinGW environment
            mingw-w64 \
            # Explicitly install the GCC cross-compiler for Windows 64-bit
            gcc-mingw-w64-x86-64 \
            # Cross-development libraries for libcurl and libcjson
            libcurl4-mingw-w64-dev \
            libcjson-mingw-w64-dev
          
      # --- 2. Compile the Windows Executable using the Cross-Compiler ---
      - name: Compile aslookup-win.c for Windows
        # Ensure 'aslookup-win.c' is the file name containing the Windows code!
        run: |
          # Use the MinGW cross-compiler binary
          x86_64-w64-mingw32-gcc -o aslookup-win.exe aslookup-win.c \
              -lcurl -lcjson \
              -lws2_32 -ldnsapi

      - name: Verify Windows Executable Size
        run: ls -l aslookup-win.exe
          
      - name: Upload Windows Executable
        uses: actions/upload-artifact@v4
        with:
          name: aslookup-windows
          path: aslookup-win.exe
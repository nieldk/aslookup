name: Build C Windows Executable

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_windows:
    runs-on: codeberg-small 
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # --- 1. Install Core MinGW Toolchain ---
      # This is the bare minimum required for cross-compilation.
      - name: Install Core MinGW Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends \
            mingw-w64 \
            gcc-mingw-w64-x86-64
          
      # --- 2. Manually Install cJSON Source (Bypassing Apt Issues) ---
      # We download the source code for cJSON since its apt package is missing.
      - name: Install cJSON Source
        run: |
          curl -LO https://raw.githubusercontent.com/DaveGamble/cJSON/master/cJSON.c
          curl -LO https://raw.githubusercontent.com/DaveGamble/cJSON/master/cJSON.h
          
      # --- 3. Compile the Windows Executable using the Cross-Compiler ---
      - name: Compile aslookup_win.c for Windows
        run: |
          # We compile your file (aslookup_win.c) and the cJSON source file (cJSON.c) together.
          # -static: Links static libraries (like cJSON) directly into the executable.
          # -lcurl: Assumes the necessary curl libraries are in the MinGW path (often true after mingw-w64 install).
          x86_64-w64-mingw32-gcc -o aslookup_win.exe aslookup_win.c cJSON.c \
              -lcurl -lws2_32 -ldnsapi -static

      - name: Verify Windows Executable Size
        run: ls -l aslookup_win.exe
          
      - name: Upload Windows Executable
        uses: actions/upload-artifact@v4
        with:
          name: aslookup-windows
          path: aslookup_win.exe
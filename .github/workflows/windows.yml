name: Build C Windows Executable

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_windows:
    runs-on: codeberg-tiny
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # --- 1. Install Core MinGW Toolchain (ABSOLUTE BARE MINIMUM) ---
      # This is fast and provides the essential cross-compiler executable.
      - name: Install Core MinGW Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends \
            mingw-w64 \
            gcc-mingw-w64-x86-64

      # --- 2. Download Dependencies and Inject into MinGW Path ---
      - name: Download cJSON Source and Inject cURL Headers
        run: |
          # 2a: Setup cJSON (Source files)
          curl -LO https://raw.githubusercontent.com/DaveGamble/cJSON/master/cJSON.c
          curl -LO https://raw.githubusercontent.com/DaveGamble/cJSON/master/cJSON.h
          
          # 2b: Setup cURL Headers (Direct injection into MinGW system path)
          TARGET_DIR="/usr/x86_64-w64-mingw32/include/curl"
          
          # Create the target subdirectory in the MinGW system path
          sudo mkdir -p "${TARGET_DIR}"
          
          # Download all required curl headers directly into the MinGW path
          # Using 'sudo' ensures permissions are correct for writing to system directory
          sudo curl -L -o "${TARGET_DIR}/curl.h" https://raw.githubusercontent.com/curl/curl/master/include/curl/curl.h
          sudo curl -L -o "${TARGET_DIR}/curlver.h" https://raw.githubusercontent.com/curl/curl/master/include/curl/curlver.h
          sudo curl -L -o "${TARGET_DIR}/easy.h" https://raw.githubusercontent.com/curl/curl/master/include/curl/easy.h
          sudo curl -L -o "${TARGET_DIR}/multi.h" https://raw.githubusercontent.com/curl/curl/master/include/curl/multi.h
          sudo curl -L -o "${TARGET_DIR}/urlapi.h" https://raw.githubusercontent.com/curl/curl/master/include/curl/urlapi.h 
          
      # --- 3. Compile the Windows Executable ---
      - name: Compile aslookup_win.c for Windows
        run: |
          # The compiler will now find <curl/curl.h> in its default system path (thanks to step 2).
          x86_64-w64-mingw32-gcc -o aslookup_win.exe aslookup_win.c cJSON.c \
              -D_WIN32_WINNT=0x0600 \
              -I. \
              -lcurl -lws2_32 -ldnsapi -static

      - name: Verify Windows Executable Size
        run: ls -l aslookup_win.exe
          
      - name: Upload Windows Executable
        uses: actions/upload-artifact@v4
        with:
          name: aslookup-windows
          path: aslookup_win.exe
name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_linux:
    runs-on: codeberg-small 
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Run Tests (Linux)
        run: go test ./...
      - name: Build Linux Binary
        run: go build -o aslookup_linux ./...

  build_windows:
    runs-on: codeberg-small 
    needs: [build_linux] # Wait for Linux build/test to pass
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          
      # --- CROSS-COMPILATION STEP FOR WINDOWS ---
      - name: Build Windows Executable
        run: |
          # GOOS=windows targets the Windows OS
          # GOARCH=amd64 targets 64-bit architecture
          GOOS=windows GOARCH=amd64 go build -o aslookup_win.exe ./...
          
      - name: Verify Windows Executable (Optional)
        run: |
          ls -l aslookup_win.exe
          echo "Windows executable created: aslookup_win.exe"

      # --- Upload Artifact (Recommended) ---
      # This allows you to download the .exe file from the job logs
      - name: Upload Windows Artifact
        # Note: You might need a Gitea-compatible action for artifact upload, 
        # or rely on direct runner paths if available.
        # This example uses the standard GitHub action syntax which is often compatible.
        uses: actions/upload-artifact@v4
        with:
          name: aslookup-windows
          path: aslookup_win.exe
name: Build C Windows Executable

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_windows:
    runs-on: codeberg-small 
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # --- 1. Install MinGW Toolchain using an optimized Action ---
      # This action should be much faster than manual apt-get, bypassing the timeout.
      - name: Setup MinGW Toolchain
        uses: forrest-coen/setup-mingw@v1
        with:
          # Install the 64-bit MinGW toolchain
          mingw-version: 'x86_64-posix-seh-rev0'

      # --- 2. Manually Install cJSON Source ---
      # Downloads the small cJSON source files directly, avoiding slow package installs.
      - name: Download cJSON Source
        run: |
          curl -LO https://raw.githubusercontent.com/DaveGamble/cJSON/master/cJSON.c
          curl -LO https://raw.githubusercontent.com/DaveGamble/cJSON/master/cJSON.h
          
      # --- 3. Compile the Windows Executable ---
      - name: Compile aslookup_win.c for Windows
        run: |
          # The action ensures the compiler is on the PATH, so the path prefix might not be needed.
          # We use the full command as a fallback, and link with -static for a standalone EXE.
          x86_64-w64-mingw32-gcc -o aslookup_win.exe aslookup_win.c cJSON.c \
              -lcurl -lws2_32 -ldnsapi -static

      - name: Verify Windows Executable Size
        run: ls -l aslookup_win.exe
          
      - name: Upload Windows Executable
        uses: actions/upload-artifact@v4
        with:
          name: aslookup-windows
          path: aslookup_win.exe
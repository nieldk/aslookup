name: Build C Windows Executable

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_windows:
    runs-on: codeberg-small 
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # --- 1. Install MinGW Toolchain and Core Cross-Libs ---
      # Using simpler, less specific package names for greater compatibility.
      - name: Install MinGW Toolchain and Core Cross-Libs
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends \
            mingw-w64 \
            gcc-mingw-w64-x86-64 \
            # Generic MinGW cross-dev package for cURL
            libcurl-mingw-w64-dev \
            # Trying a simpler cJSON dev package name, or relying on base MinGW libs
            # We remove the libcjson-mingw-w64-dev line as it failed
            # If the next step fails on cJSON.h, we will need to manually download it.
            
      # --- 2. Compile the Windows Executable using the Cross-Compiler ---
      - name: Compile aslookup_win.c for Windows
        # NOTE: If cJSON.h is not found after this change, we will need to install it manually.
        run: |
          # Use the MinGW cross-compiler binary
          x86_64-w64-mingw32-gcc -o aslookup_win.exe aslookup_win.c \
              -lcurl -lcjson \
              -lws2_32 -ldnsapi

      - name: Verify Windows Executable Size
        run: ls -l aslookup_win.exe
          
      - name: Upload Windows Executable
        uses: actions/upload-artifact@v4
        with:
          name: aslookup-windows
          path: aslookup_win.exe
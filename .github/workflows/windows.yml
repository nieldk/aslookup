name: Build C Windows Executable

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_windows:
    runs-on: codeberg-small 
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # --- 1. Install Core MinGW Toolchain (ABSOLUTE BARE MINIMUM) ---
      # This is the ONLY apt install step; it provides the cross-compiler executable.
      - name: Install Core MinGW Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends \
            mingw-w64 \
            gcc-mingw-w64-x86-64

      # --- 2. Manually Setup Dependencies (cURL and cJSON Headers/Sources) ---
      # Downloads all required header/source files manually from GitHub, bypassing apt issues.
      - name: Download cJSON and cURL Headers
        run: |
          # 2a: Setup cJSON (Source files)
          curl -LO https://raw.githubusercontent.com/DaveGamble/cJSON/master/cJSON.c
          curl -LO https://raw.githubusercontent.com/DaveGamble/cJSON/master/cJSON.h
          
          # 2b: Setup cURL (Header files)
          mkdir -p curl
          
          # Download all required curl headers: curl.h, curlver.h
          curl -L -o curl/curl.h https://raw.githubusercontent.com/curl/curl/master/include/curl/curl.h
          curl -L -o curl/curlver.h https://raw.githubusercontent.com/curl/curl/master/include/curl/curlver.h
          
          # FIX: Download the newly missing easy.h (and multi.h, a likely subsequent dependency)
          curl -L -o curl/easy.h https://raw.githubusercontent.com/curl/curl/master/include/curl/easy.h
          curl -L -o curl/multi.h https://raw.githubusercontent.com/curl/curl/master/include/curl/multi.h
          
          # NOTE: The broken download for system.h is now REMOVED to stop the 404 compilation error.
          
      # --- 3. Compile the Windows Executable ---
      - name: Compile aslookup_win.c for Windows
        run: |
          # The -I. and -Icurl flags tell the compiler where to find cJSON.h and curl/*.h
          # We rely on the core MinGW install including the necessary definitions and static libraries.
          x86_64-w64-mingw32-gcc -o aslookup_win.exe aslookup_win.c cJSON.c \
              -I. -Icurl \
              -lcurl -lws2_32 -ldnsapi -static

      - name: Verify Windows Executable Size
        run: ls -l aslookup_win.exe
          
      - name: Upload Windows Executable
        uses: actions/upload-artifact@v4
        with:
          name: aslookup-windows
          path: aslookup_win.exe

name: "Alpine Build and APK Release (Codeberg)"

on:
  push:
    tags:
      - "*"

jobs:
  build:
    runs-on: docker

    container:
      image: alpine:latest

    steps:
      - name: "Checkout code"
        uses: codeberg-actions/checkout@v3

      - name: "Install Build Dependencies 🛠️"
        run: |
          apk update
          apk add --no-cache build-base curl-dev git cmake tar jq

      - name: "Clone cJSON"
        run: git clone https://github.com/DaveGamble/cJSON.git /tmp/cJSON

      - name: "Build and Install cJSON"
        run: |
          cd /tmp/cJSON
          mkdir build && cd build
          cmake -DCMAKE_INSTALL_PREFIX=/usr -DBUILD_SHARED_LIBS=ON ..
          make && make install

      - name: "Set version"
        run: echo "RELEASE_VERSION=${CI_COMMIT_TAG#v}" >> $GITHUB_ENV

      - name: "Build aslookup binary"
        run: gcc aslookup.c -o aslookup -lcurl -lcjson -lresolv -DVERSION="\"$RELEASE_VERSION\""

      - name: "Prepare package"
        run: |
          mkdir -p pkg/usr/local/bin
          cp aslookup pkg/usr/local/bin/
          mkdir -p pkg/usr/lib
          cp /usr/lib/libcjson.so.1 pkg/usr/lib/

          echo "pkgname = aslookup" > pkg/.PKGINFO
          echo "pkgver = $RELEASE_VERSION" >> pkg/.PKGINFO
          echo "maintainer = Niel Nielsen <nieldk@gmail.com>" >> pkg/.PKGINFO
          echo "url = https://codeberg.org/nieldk/aslookup" >> pkg/.PKGINFO
          echo "arch = x86_64" >> pkg/.PKGINFO
          echo "description = ASN lookup utility" >> pkg/.PKGINFO
          echo "depend = libc6, libcurl4, libcjson" >> pkg/.PKGINFO

          cd pkg
          tar -czf data.tar.gz usr/
          tar -czf control.tar.gz .PKGINFO
          tar -czf aslookup_${RELEASE_VERSION}_x86_64.apk control.tar.gz data.tar.gz

      - name: "Upload APK to Codeberg Release"
        run: |
          RELEASE_ID=$(curl -s -H "Authorization: token $CODEBERG_TOKEN" \
            "https://codeberg.org/api/v1/repos/${CI_REPO_OWNER}/${CI_REPO_NAME}/releases" \
            | jq -r ".[] | select(.tag_name==\"${CI_COMMIT_TAG}\") | .id")

          if [ -z "$RELEASE_ID" ]; then
            echo "Creating release for tag ${CI_COMMIT_TAG}"
            RELEASE_ID=$(curl -s -X POST \
              -H "Authorization: token $CODEBERG_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"${CI_COMMIT_TAG}\",\"name\":\"Release ${CI_COMMIT_TAG}\"}" \
              "https://codeberg.org/api/v1/repos/${CI_REPO_OWNER}/${CI_REPO_NAME}/releases" \
